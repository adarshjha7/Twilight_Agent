<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 16px; font-weight: 600; color: #fff; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.user   { align-self: flex-end; background: #1d4ed8; color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai     { align-self: flex-start; background: #1e1e1e; border: 1px solid #2a2a2a; border-bottom-left-radius: 4px; }
    .msg.wa     { align-self: flex-start; background: #14532d; border: 1px solid #166534; border-bottom-left-radius: 4px; }

    .msg-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .wa .msg-label { color: #86efac; }

    pre {
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      overflow-x: auto;
      margin-top: 8px;
      color: #a3e635;
    }

    .typing { color: #555; font-size: 13px; font-style: italic; padding: 4px 0; }

    footer {
      padding: 14px 20px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 10px;
    }
    footer input {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
    }
    footer input:focus { border-color: #1d4ed8; }
    footer button {
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    footer button:hover { background: #1e40af; }
    footer button:disabled { background: #333; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div class="status-dot" id="dot"></div>
  <h1>Agent AI</h1>
</header>

<div id="chat">
  <div class="msg ai">
    <div class="msg-label">Agent</div>
    Hello! I'm your AI agent. Ask me anything, or send a bill image to your WhatsApp group — I'll extract the data and show it here automatically.
  </div>
</div>

<footer>
  <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
  <button id="send">Send</button>
</footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const dot = document.getElementById('dot');

  // ── WebSocket for WhatsApp events ────────────────────────────────────────
  let ws;
  function connectWS() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { dot.style.background = '#22c55e'; dot.style.boxShadow = '0 0 6px #22c55e'; };
    ws.onclose = () => {
      dot.style.background = '#ef4444';
      dot.style.boxShadow = 'none';
      setTimeout(connectWS, 3000); // auto-reconnect
    };
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'wa_image') {
        addWaMessage(data);
      }
    };
  }
  connectWS();

  function addWaMessage(data) {
    const div = document.createElement('div');
    div.className = 'msg wa';
    div.innerHTML = `
      <div class="msg-label">📱 WhatsApp — ${data.chat || 'unknown chat'}</div>
      Image received. Extracted bill data:
      <pre>${JSON.stringify(data.result, null, 2)}</pre>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  // ── Chat with LLM ────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMsg('user', text);
    input.value = '';
    sendBtn.disabled = true;

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'Agent is thinking...';
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      typing.remove();
      addMsg('ai', data.reply);
    } catch (e) {
      typing.remove();
      addMsg('ai', 'Error: could not reach agent service.');
    }

    sendBtn.disabled = false;
    input.focus();
  }

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="msg-label">${role === 'user' ? 'You' : 'Agent'}</div>${escHtml(text)}`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  sendBtn.onclick = sendMessage;
  input.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
</script>
</body>
</html>
